<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#76bfff">
  <meta name="description" content="mmi机——住着你的 char 的晶蓝小手机">
  <title>mmi机</title>

  <link rel="stylesheet" href="./css/style.css">

  <!-- 第一版使用 Dexie 管理 IndexedDB。
       正式离线发布时，将该文件下载到 vendor/ 目录本地引用。 -->
  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
</head>

<body>
  <main class="phone-shell" id="phoneShell">
    <div class="phone-screen">

      <!-- 状态栏 -->
      <header class="status-bar">
        <span id="statusTime">09:41</span>
        <div class="status-icons">
          <span>⌁</span>
          <span>▮▮▮</span>
          <span>▰</span>
        </div>
      </header>

      <!-- 顶部标题 -->
      <section class="top-header">
        <div>
          <p class="eyebrow">MY MINI MOBILE</p>
          <h1 id="pageTitle">mmi机</h1>
        </div>
        <button class="header-avatar" id="userAvatarButton" aria-label="用户资料">
          <span>你</span>
        </button>
      </section>

      <!-- 应用内容区域 -->
      <section class="app-viewport" id="appViewport"></section>

      <!-- 底部导航 -->
      <nav class="bottom-nav">
        <button class="nav-button active" data-route="home">
          <span class="nav-icon">⌂</span>
          <span>桌面</span>
        </button>
        <button class="nav-button" data-route="messages">
          <span class="nav-icon">◌</span>
          <span>消息</span>
        </button>
        <button class="nav-button" data-route="gallery">
          <span class="nav-icon">▧</span>
          <span>相册</span>
        </button>
        <button class="nav-button" data-route="settings">
          <span class="nav-icon">⚙</span>
          <span>设置</span>
        </button>
      </nav>

    </div>
  </main>

  <!-- char 心声弹窗 -->
  <div class="modal-layer hidden" id="charModal">
    <article class="char-modal">
      <button class="modal-close" id="closeCharModal">×</button>

      <div class="char-modal-heading">
        <div class="large-char-avatar" id="modalCharAvatar">澈</div>
        <div>
          <p class="eyebrow">CHAR PROFILE</p>
          <h2 id="modalCharName">沈澈</h2>
          <p class="muted-text" id="modalCharSubtitle">你的专属角色</p>
        </div>
      </div>

      <div class="char-status-row">
        <div class="status-pill">
          <span>心情</span>
          <strong id="modalMood">平静</strong>
        </div>
        <div class="status-pill">
          <span>关系</span>
          <strong id="modalAffection">12</strong>
        </div>
      </div>

      <section class="thought-card">
        <div class="thought-title">
          <span class="thought-light">✦</span>
          <span>char 心声</span>
          <span class="private-badge">仅你可见</span>
        </div>
        <p id="modalThoughts">
          他刚刚看见你上线了，但还在犹豫要不要主动发消息。
        </p>
      </section>

      <div class="modal-actions">
        <button class="capsule-button primary" id="openCharChat">
          打开聊天
        </button>
        <button class="capsule-button secondary" id="openCharProfile">
          查看档案
        </button>
      </div>
    </article>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>

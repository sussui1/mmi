<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
  >

  <meta name="theme-color" content="#72bdf3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>mmi机</title>

  <link rel="stylesheet" href="./css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
</head>

<body>
  <main class="phone-shell">
    <div class="phone-screen">

      <header class="status-bar">
        <span id="statusTime">09:41</span>

        <div class="status-icons">
          <span id="networkStatus">●</span>
          <span>▮▮▮</span>
          <span>▰</span>
        </div>
      </header>

      <header class="top-header">
        <button
          id="backButton"
          class="back-button hidden"
          aria-label="返回"
        >
          ‹
        </button>

        <div class="title-block">
          <p class="eyebrow">MY MINI MOBILE</p>
          <h1 id="pageTitle">mmi机</h1>
        </div>

        <!-- 右上角 user 面具入口 -->
        <button
          class="header-avatar"
          id="userAvatarButton"
          aria-label="user 面具"
        >
          <span id="userAvatarText">你</span>
          <img id="userAvatarImage" alt="user头像">
        </button>
      </header>

      <section
        class="app-viewport"
        id="appViewport"
      ></section>

      <!-- 固定底部导航 -->
      <nav class="bottom-nav">
        <button class="nav-button" data-route="messages">
          <span class="nav-icon">◌</span>
          <span>消息</span>
        </button>

        <button class="nav-button" data-route="group">
          <span class="nav-icon">◎</span>
          <span>群聊</span>
        </button>

        <button class="nav-button" data-route="worldbook">
          <span class="nav-icon">✧</span>
          <span>世界书</span>
        </button>

        <button class="nav-button" data-route="settings">
          <span class="nav-icon">⚙</span>
          <span>设置</span>
        </button>
      </nav>
    </div>
  </main>

  <!-- user 面具 -->
  <div
    class="modal-layer hidden"
    id="userModal"
  >
    <article class="char-modal">
      <button
        class="modal-close"
        id="closeUserModal"
      >
        ×
      </button>

      <p class="eyebrow">USER MASK</p>
      <h2>user 面具</h2>

      <div class="user-preview">
        <div
          class="user-large-avatar"
          id="userPreviewAvatar"
        >
          你
        </div>
      </div>

      <form
        class="form-list"
        id="userForm"
      >
        <label>
          显示名称
          <input
            name="displayName"
            id="userDisplayName"
            placeholder="你希望 char 怎么称呼你"
          >
        </label>

        <label>
          头像
          <input
            name="avatar"
            id="userAvatarFile"
            type="file"
            accept="image/*"
          >
        </label>

        <label>
          user 资料
          <textarea
            name="profile"
            id="userProfile"
            rows="5"
            placeholder="可以写你的身份、外貌、偏好等"
          ></textarea>
        </label>

        <button
          class="capsule-button primary"
          type="submit"
        >
          保存面具
        </button>
      </form>
    </article>
  </div>

  <!-- char 心声 -->
  <div
    class="modal-layer hidden"
    id="charModal"
  >
    <article class="char-modal">
      <button
        class="modal-close"
        id="closeCharModal"
      >
        ×
      </button>

      <div class="char-modal-heading">
        <div
          class="large-char-avatar"
          id="modalCharAvatar"
        >
          ?
        </div>

        <div>
          <p class="eyebrow">CHAR PROFILE</p>
          <h2 id="modalCharName">未命名 char</h2>
          <p
            class="muted-text"
            id="modalCharSubtitle"
          >
            点击头像查看心声
          </p>
        </div>
      </div>

      <div class="char-status-row">
        <div class="status-pill">
          <span>心情</span>
          <strong id="modalMood">未知</strong>
        </div>

        <div class="status-pill">
          <span>关系</span>
          <strong id="modalAffection">0</strong>
        </div>
      </div>

      <section class="thought-card">
        <div class="thought-title">
          <span class="thought-light">✦</span>
          <span>char 心声</span>
          <span class="private-badge">仅你可见</span>
        </div>

        <p id="modalThoughts">暂无心声记录。</p>
      </section>

      <div class="modal-actions">
        <button
          class="capsule-button primary"
          id="openCharChat"
        >
          打开聊天
        </button>

        <button
          class="capsule-button secondary"
          id="openCharProfile"
        >
          查看档案
        </button>
      </div>
    </article>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
